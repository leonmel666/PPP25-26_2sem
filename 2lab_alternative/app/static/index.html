<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Music Player</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <button class="icon-btn" id="backBtn" title="Назад">
        <i class="fas fa-arrow-left"></i>
    </button>
    <span class="breadcrumb" id="breadcrumb">Библиотека</span>
    <button class="icon-btn spin-on-click" id="rescanBtn" title="Обновить библиотеку">
        <i class="fas fa-rotate-right"></i>
    </button>
</nav>

<main class="page" id="app">
    <div id="content">
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Загрузка библиотеки…</p>
        </div>
    </div>
</main>

<!-- Плеер-бар внизу -->
<div class="player-bar" id="playerBar" hidden>
    <img class="player-cover" id="pCover" src="" alt="Обложка">

    <div class="player-meta">
        <div class="player-title" id="pTitle">—</div>
        <div class="player-artist" id="pArtist">—</div>
    </div>

    <div class="player-center">
        <div class="player-controls">
            <button class="ctrl-btn" id="pShuffle" title="Случайный порядок">
                <i class="fas fa-shuffle"></i>
            </button>
            <button class="ctrl-btn" id="pPrev" title="Предыдущий">
                <i class="fas fa-backward-step"></i>
            </button>
            <button class="ctrl-btn play-btn" id="pPlayPause" title="Играть / Пауза">
                <i class="fas fa-play"></i>
            </button>
            <button class="ctrl-btn" id="pNext" title="Следующий">
                <i class="fas fa-forward-step"></i>
            </button>
            <button class="ctrl-btn" id="pRepeat" title="Повтор">
                <i class="fas fa-repeat"></i>
            </button>
        </div>
        <div class="player-progress">
            <span class="time-cur" id="pTimeCur">0:00</span>
            <div class="progress-track" id="progressTrack">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="time-total" id="pTimeTotal">0:00</span>
        </div>
    </div>

    <div class="player-volume">
        <button class="ctrl-btn vol-icon" id="pVolIcon" title="Звук">
            <i class="fas fa-volume-high"></i>
        </button>
        <input type="range" id="pVolume" min="0" max="1" step="0.01" value="0.8">
    </div>
</div>

<script src="/static/js/player.js"></script>
</body>
</html>
